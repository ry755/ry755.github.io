on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v5
        with:
          path: site

      - name: Checkout fox32
        uses: actions/checkout@v5
        with:
          repository: 'fox32-arch/fox32'
          github-server-url: 'https://codeberg.org'
          path: fox32_src

      - name: Checkout fox32rom
        uses: actions/checkout@v5
        with:
          repository: 'fox32-arch/fox32rom'
          github-server-url: 'https://codeberg.org'
          path: fox32rom

      - name: Checkout fox32os
        uses: actions/checkout@v5
        with:
          repository: 'fox32-arch/fox32os'
          github-server-url: 'https://codeberg.org'
          path: fox32os

      - name: Checkout ryfs
        uses: actions/checkout@v5
        with:
          repository: 'ry755/ryfs'
          path: ryfs

      - name: Build site
        run: |
          cd site
          make

      - name: Download latest fox32asm version
        uses: robinraju/release-downloader@v1
        with:
          repository: 'fox32-arch/fox32asm'
          latest: true
          extract: true
          fileName: '*-x86_64-linux.zip'

      - name: Install lua5.4, vim, python3
        run: |
          sudo apt update
          sudo apt install -y lua5.4 vim python3

      - name: Build fox32rom
        run: |
          cd fox32rom
          make FOX32ASM=../fox32asm

      - name: Move fox32.rom into the root folder
        run: |
          cp fox32rom/fox32.rom fox32_src/fox32.rom

      - name: Build fox32os
        run: |
          cd fox32os
          make FOX32ASM=../fox32asm

      - name: Move fox32os.img into the root folder
        run: |
          cp fox32os/fox32os.img fox32_src/fox32os.img

      - name: Checkout Emscripten SDK
        uses: actions/checkout@v5
        with:
          repository: 'emscripten-core/emsdk'
          path: emsdk

      - name: Install Emscripten SDK
        run: |
          emsdk/emsdk install latest
          emsdk/emsdk activate latest

      - name: Add readme.txt to fox32os.img and add to startup.bat
        run: |
          cd fox32_src
          python3 ../ryfs/ryfs.py -d user/desktop add fox32os.img ../site/fox32/additional_files/readme.txt
          python3 ../ryfs/ryfs.py -d system export fox32os.img startup.bat
          sed -i '/exit;/i \
          */apps/hjkl /user/desktop/readme.txt;' startup.bat
          python3 ../ryfs/ryfs.py -d system add fox32os.img startup.bat

      - name: Build fox32
        run: |
          source emsdk/emsdk_env.sh
          cd fox32_src
          make TARGET=wasm
          cp fox32.wasm fox32.js fox32.data ../site/fox32/

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
